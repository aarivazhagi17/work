<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <!--Bootstrap Link-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!--Css Link-->
    <link rel="stylesheet" href="../project/Contact.css">
    <title>Document</title>
</head>
<body>
    
    <section id="contact" class="py-5">
    <div class="container">
      <h2 class="text-center fw-bold mb-4">Contact Us</h2>

      <div class="row justify-content-center">
        <div class="col-md-6">
          <form>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="4" placeholder="Enter your message"></textarea>
            </div>

            <button class="btn btn-warning w-100 fw-bold">Send Message</button>
          </form>
        </div>
      </div>
</div>
    </section>

    <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0">© 2026 FoodieHub | All Rights Reserved</p>
  </footer>
</body>
</html>
